    :root { --probe-w: 390px; }

    .probe { width: var(--probe-w); height: 844px; overflow: auto; background: var(--paper); }

    h1 { font-family: var(--font-display); font-size: 22px; margin-bottom: 12px; }
    .bad { color: #a8261c; font-weight: 600; }
    .good { color: #2f6b4f; font-weight: 600; }

<body>
  <h1>SnapLife AI — Audit tự động</h1>
  <p class="muted" style="font-size:13px">Harness này render MỌI màn hình ở 390×844 rồi đo: lỗi runtime, tên truy cập được,
    touch target, tràn ngang, tương phản màu, ảnh hỏng, hex hardcode, id trùng. Kết quả nằm trong
    <code>&lt;pre id="report"&gt;</code> để <code>--dump-dom</code> đọc được.</p>
  <pre id="report">Đang chạy…</pre>
  <div id="stage"></div>

  <script type="module" src="/tools/audit.js"></script>
