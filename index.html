<!DOCTYPE html>
<html lang="vi" data-theme="light" data-mode="demo">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="SnapLife AI — demo giao diện học từ vựng tiếng Anh qua ảnh và câu chuyện của chính bạn." />
  <meta name="color-scheme" content="light dark" />
  <title>SnapLife AI · Demo giao diện</title>

  <!-- Font tu chua trong assets/fonts - demo chay duoc khi mat mang.
       Sinh boi tools/fetch_fonts.py; xem chu thich trong styles/fonts.css. -->
  <link rel="stylesheet" href="styles/fonts.css" />

  <link rel="stylesheet" href="styles/tokens.css" />
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/components.css" />
  <link rel="stylesheet" href="styles/shell.css" />
  <link rel="stylesheet" href="styles/screens-a.css" />
  <link rel="stylesheet" href="styles/screens-b.css" />
  <link rel="stylesheet" href="styles/screens-c.css" />
  <link rel="stylesheet" href="styles/screens-d.css" />
  <link rel="stylesheet" href="styles/screens-e.css" />
  <link rel="stylesheet" href="styles/web.css" />
</head>

<body class="shell">
  <div class="shell">
    <!-- ------------------------------ Thanh trên ---------------------------- -->
    <header class="shell__topbar">
      <div class="shell__brand">
        <span class="shell__logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3.5 8.5a2 2 0 0 1 2-2h1.9l1.2-2h6.8l1.2 2h1.9a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/>
            <circle cx="12" cy="13" r="3.9"/>
          </svg>
        </span>
        <div>
          <div class="shell__name">SnapLife AI</div>
          <div class="shell__tag">Học tiếng Anh qua chính câu chuyện và cuộc sống của bạn</div>
        </div>
      </div>

      <button class="iconbtn iconbtn--solid" id="rail-toggle" type="button" aria-label="Danh sách màn hình">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M10 6.5h10"/><path d="M10 12h10"/><path d="M10 17.5h10"/>
          <path d="m3.5 6 1.6 1.6L8 4.8"/><path d="m3.5 11.4 1.6 1.6L8 10.2"/><path d="m3.5 16.8 1.6 1.6L8 15.6"/>
        </svg>
      </button>

      <div class="shell__tools" id="tools"></div>
    </header>

    <!-- ------------------------- Rail chọn màn hình ------------------------- -->
    <nav class="rail" id="rail" aria-label="Danh sách màn hình demo">
      <div id="rail-body"></div>
    </nav>

    <!-- ------------------------- Sân khấu & thiết bị ------------------------ -->
    <main class="stage">
      <div class="stage__controls">
        <div class="row" style="gap:8px">
          <span class="label">Đang xem</span>
          <strong id="stage-title" style="font-size:var(--fs-base)">Hôm nay</strong>
        </div>
        <span class="grow"></span>
        <div id="hud"></div>
      </div>

      <div class="device" id="device">
        <div class="device__viewport">
          <div class="device__notch" aria-hidden="true"></div>

          <div class="app" id="app">
            <div class="app__statusbar" id="statusbar" aria-hidden="true">
              <span id="clock">09:41</span>
              <span class="app__statusbar-icons">
                <svg viewBox="0 0 18 12" width="17" height="11" fill="currentColor"><rect x="0" y="7.5" width="3" height="4.5" rx="1"/><rect x="4.5" y="5" width="3" height="7" rx="1"/><rect x="9" y="2.5" width="3" height="9.5" rx="1"/><rect x="13.5" y="0" width="3" height="12" rx="1" opacity=".4"/></svg>
                <svg viewBox="0 0 16 12" width="15" height="11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M1 4.2a10 10 0 0 1 14 0"/><path d="M3.6 7a6.4 6.4 0 0 1 8.8 0"/><circle cx="8" cy="10" r="1.2" fill="currentColor" stroke="none"/></svg>
                <svg viewBox="0 0 26 12" width="25" height="11" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="0.7" y="0.7" width="21" height="10.6" rx="3"/><rect x="2.4" y="2.4" width="15" height="7.2" rx="1.8" fill="currentColor" stroke="none"/><path d="M23.4 4.2v3.6" stroke-linecap="round"/></svg>
              </span>
            </div>

            <main class="app__screen" id="screen" role="main"></main>

            <nav class="tabbar" id="tabbar" aria-label="Điều hướng chính" style="display:none"></nav>

            <div class="app__homebar" aria-hidden="true"></div>
            <div class="app__overlay" id="overlay"></div>
          </div>
        </div>
      </div>

      <p class="muted-2" style="font-size:var(--fs-xs);text-align:center;max-width:44ch">
        Phím tắt: <strong>←</strong> / <strong>→</strong> đổi màn hình · <strong>T</strong> đổi giao diện sáng/tối ·
        <strong>F</strong> chế độ chỉ ứng dụng · <strong>M</strong> tắt/bật âm thanh
      </p>
    </main>

    <!-- ------------------------------ Inspector ---------------------------- -->
    <aside class="inspector" id="inspector" aria-label="Thông tin thiết kế">
      <div id="inspector-body"></div>
    </aside>
  </div>

  <!-- Chọn chế độ TRƯỚC khi vẽ để không nhấp nháy:
       · Cửa sổ hẹp (< 1100px) → web mode, vì khung điện thoại không còn chỗ.
       · Cửa sổ rộng → demo shell (rail + khung điện thoại + inspector) để trình bày.
       · Người dùng đã bấm W lần nào thì tôn trọng lựa chọn đã lưu. -->
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var forced = params.get('mode');
      var mode = null;
      try {
        /* KHOÁ ĐÃ ĐỔI TÊN (thêm .v2).
           Bản trước ghi chế độ MẶC ĐỊNH vào khoá 'snaplife.mode' ngay khi nạp
           trang, nên ai từng mở bản cũ — khi đó mặc định ở cửa sổ ≥1100px là
           'demo' — đều bị ghim vĩnh viễn vào chế độ khung điện thoại, và bản
           sửa "mặc định là web" không bao giờ tới được máy họ. Đổi khoá để
           giá trị cũ đó không còn hiệu lực. */
        mode = localStorage.getItem('snaplife.mode.v2');
      } catch (e) {
        /* localStorage có thể bị chặn */
      }
      /* ?mode=web|demo ép chế độ — dùng cho QA và cho link chia sẻ. */
      if (forced === 'web' || forced === 'demo') mode = forced;
      else if (mode !== 'demo' && mode !== 'web') {
        /* MẶC ĐỊNH LÀ WEB.
           Trước đây mặc định là 'demo' khi cửa sổ ≥1100px, nên mở demo trên máy
           tính thì thấy một chiếc điện thoại giữa màn hình — đúng nhưng chỉ hợp
           lúc trình bày. Giờ web là mặc định ở mọi thiết bị; chế độ khung điện
           thoại là lựa chọn: ?mode=demo hoặc phím W. */
        mode = 'web';
      }
      document.documentElement.setAttribute('data-mode', mode);
    })();
  </script>

  <!-- Bắt lỗi runtime để QA đọc được từ --dump-dom mà không cần DevTools -->
  <script>
    window.__BOOT_ERRORS__ = [];
    (function () {
      function note(msg) {
        var text = String(msg).slice(0, 300);
        window.__BOOT_ERRORS__.push(text);
        document.documentElement.setAttribute(
          'data-boot-errors',
          window.__BOOT_ERRORS__.join(' | ').slice(0, 900)
        );
      }
      window.addEventListener('error', function (e) { note(e.message || e.error); });
      window.addEventListener('unhandledrejection', function (e) {
        note('rejection: ' + ((e.reason && e.reason.message) || e.reason));
      });
      var orig = console.error.bind(console);
      console.error = function () {
        note('console.error: ' + Array.prototype.map.call(arguments, String).join(' '));
        orig.apply(null, arguments);
      };
    })();
  </script>

  <!-- Nút đổi chế độ — hiện ở CẢ HAI chế độ (xem styles/web.css). -->
  <button class="mode-toggle" id="mode-toggle" type="button" aria-label="Về chế độ demo có khung điện thoại">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 5.5h2"/>
    </svg>
    <span id="mode-toggle-label">Chế độ demo</span>
  </button>

  <script type="module" src="src/app.js"></script>
</body>
</html>
